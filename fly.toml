# fly.toml app configuration file for millionare-shivji-1min-bot (1m timeframe bot)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'millionare-shivji-1min-bot'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  DATA_DIR = '/data'
  LOG_DIR = '/data/logs'
  FIXED_SL_PTS = '150.0'
  FIXED_TP_PTS = '200.0'
  MAX_PRE_ENTRY_SLIP_PTS = '70.0'

[[mounts]]
  source = 'volsurge_1min_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 10
    soft_limit = 5

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
